<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Siriel Macroquad</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
            position: fixed;
            touch-action: none;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #glcanvas {
            outline: none;
            width: 100%;
            height: 100%;
            display: block;
        }
        /* Fullscreen button - always visible, top-left to avoid jump button */
        #fullscreen-btn {
            display: flex;
            position: fixed;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            border: 2px solid rgba(255,255,255,0.5);
            border-radius: 8px;
            background: rgba(0,0,0,0.7);
            color: white;
            font-size: 24px;
            cursor: pointer;
            z-index: 1000;
            align-items: center;
            justify-content: center;
            user-select: none;
        }
        /* Hide when already in fullscreen */
        body.fullscreen #fullscreen-btn {
            display: none !important;
        }
        /* Loading screen */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            font-family: monospace;
            color: #fff;
        }
        #loading-screen.hidden {
            display: none;
        }
        .loading-title {
            font-size: 32px;
            margin-bottom: 20px;
            color: #fc0;
        }
        .loading-bar-container {
            width: 300px;
            height: 24px;
            border: 2px solid #666;
            border-radius: 4px;
            background: #222;
            overflow: hidden;
        }
        .loading-bar {
            height: 100%;
            background: linear-gradient(90deg, #fc0, #f80);
            width: 0%;
            transition: width 0.3s ease;
        }
        .loading-text {
            margin-top: 16px;
            font-size: 14px;
            color: #aaa;
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="loading-title">SIRIEL</div>
        <div class="loading-bar-container">
            <div class="loading-bar" id="loading-bar"></div>
        </div>
        <div class="loading-text" id="loading-text">Loading assets...</div>
    </div>

    <canvas id="glcanvas" tabindex="0"></canvas>
    <button id="fullscreen-btn" title="Toggle Fullscreen">[]</button>

    <script src="https://not-fl3.github.io/miniquad-samples/mq_js_bundle.js"></script>
    <script>
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        const loadingScreen = document.getElementById('loading-screen');
        const loadingBar = document.getElementById('loading-bar');
        const loadingText = document.getElementById('loading-text');

        // Animate loading bar with status updates
        let progress = 0;
        let stage = 0;
        const stages = ['Loading WASM...', 'Loading sprites...', 'Loading sounds...', 'Loading levels...', 'Starting game...'];

        const loadingInterval = setInterval(() => {
            progress += Math.random() * 12;
            if (progress > 95) progress = 95;

            // Update stage text based on progress
            const newStage = Math.min(Math.floor(progress / 20), stages.length - 1);
            if (newStage !== stage) {
                stage = newStage;
                loadingText.textContent = stages[stage];
            }

            loadingBar.style.width = progress + '%';
        }, 300);

        // Load WASM
        load("siriel.wasm");

        // Hide after max load time (game likely ready by then)
        setTimeout(() => {
            clearInterval(loadingInterval);
            loadingBar.style.width = '100%';
            loadingText.textContent = 'Ready!';
            setTimeout(() => {
                loadingScreen.classList.add('hidden');
            }, 400);
        }, 6000);

        // Fullscreen toggle function
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log('Fullscreen error:', err);
                });
            } else {
                document.exitFullscreen();
            }
        }

        // Button click handler
        fullscreenBtn.addEventListener('click', toggleFullscreen);

        // Update button visibility on fullscreen change
        document.addEventListener('fullscreenchange', () => {
            if (document.fullscreenElement) {
                document.body.classList.add('fullscreen');
            } else {
                document.body.classList.remove('fullscreen');
            }
        });

        // Auto-hide URL bar on mobile (scroll to top trick)
        function hideUrlBar() {
            window.scrollTo(0, 0);
            document.body.style.height = window.innerHeight + 'px';
        }

        // Call on load and resize
        hideUrlBar();
        window.addEventListener('resize', hideUrlBar);

        // Prevent default touch behaviors (scrolling, zooming)
        document.addEventListener('touchmove', (e) => {
            if (e.target.tagName !== 'CANVAS') return;
            e.preventDefault();
        }, { passive: false });

    </script>
</body>
</html>
